<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostfall — Deck Mono Green</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@400;600;700;800&family=Oswald:wght@600;700&display=swap');

        :root {
            --gold-light: #ead9a8;
            --gold-main: #b8a26b;

            /* Elemento Naturaleza */
            --nature-border-subtle: rgba(52, 96, 59, 0.45);
            --nature-border-accent: #34603b;
            --nature-bg: linear-gradient(180deg, #18381c 0%, #0a1c0e 100%);

            /* Textura de grano fino */
            --noise-tex: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");

            /* Follaje dibujado como ramas continuas, no como mosaico repetido */
            --header-foliage: url("data:image/svg+xml,%3Csvg viewBox='0 0 900 110' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%2386efac' stroke-width='2' stroke-linecap='round' stroke-opacity='.11'%3E%3Cpath d='M0 87 C74 64 106 23 185 30 C248 36 276 69 360 53'/%3E%3Cpath d='M466 105 C548 91 573 60 641 49 C724 35 773 11 900 39'/%3E%3Cpath d='M616 55 C598 35 596 17 608 1'/%3E%3Cpath d='M706 36 C699 61 715 83 750 106'/%3E%3Cpath d='M794 28 C825 45 843 72 852 109'/%3E%3C/g%3E%3Cg fill='%234ade80' fill-opacity='.09' stroke='%2386efac' stroke-opacity='.13' stroke-width='1.2'%3E%3Cg transform='translate(78 57) rotate(-34) scale(.7)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(151 31) rotate(-9) scale(.58)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(230 40) rotate(25) scale(.66)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(569 79) rotate(-31) scale(.76)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(622 51) rotate(-105) scale(.62)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(671 42) rotate(17) scale(.82)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(718 33) rotate(-49) scale(.66)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(779 25) rotate(28) scale(.72)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(846 34) rotate(48) scale(.6)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            --type-foliage: url("data:image/svg+xml,%3Csvg viewBox='0 0 900 72' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 53 C92 13 164 65 258 35 S432 16 532 45 S711 60 900 25' fill='none' stroke='%2386efac' stroke-width='1.7' stroke-linecap='round' stroke-opacity='.1'/%3E%3Cg fill='%234ade80' fill-opacity='.075' stroke='%2386efac' stroke-opacity='.11' stroke-width='1'%3E%3Cg transform='translate(112 31) rotate(-24) scale(.55)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(245 38) rotate(28) scale(.66)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(386 25) rotate(-39) scale(.5)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(528 44) rotate(20) scale(.62)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(681 48) rotate(44) scale(.56)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3Cg transform='translate(813 32) rotate(-28) scale(.64)'%3E%3Cpath d='M0 0 C10-17 29-21 44-10 C34 5 17 12 0 0Z'/%3E%3Cpath d='M4-1 L36-9' fill='none'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #08080a;
            background-image:
                radial-gradient(ellipse at 50% 10%, rgba(24, 56, 28, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(15, 23, 42, 0.4) 0%, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
            font-family: 'Lora', serif;
            margin: 0;
            padding: 60px 30px 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .studio-header {
            position: relative;
            width: min(1120px, calc(100vw - 40px));
            text-align: center;
            margin: 0 auto 42px;
            padding: 30px 34px 28px;
            overflow: hidden;
            border: 1px solid rgba(184, 162, 107, 0.33);
            border-radius: 18px;
            background:
                linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.025), transparent),
                linear-gradient(180deg, rgba(18, 39, 21, 0.97), rgba(8, 16, 10, 0.97));
            box-shadow:
                0 22px 60px rgba(0, 0, 0, 0.48),
                inset 0 1px rgba(255, 255, 255, 0.045);
        }

        .studio-header::before,
        .studio-header::after {
            content: "";
            position: absolute;
            top: 18px;
            bottom: 18px;
            width: 4px;
            background: linear-gradient(transparent, #4ade80, transparent);
            opacity: 0.72;
        }

        .studio-header::before {
            left: 15px;
        }

        .studio-header::after {
            right: 15px;
        }

        .studio-title {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: clamp(30px, 4vw, 47px);
            color: var(--gold-light);
            margin: 0;
            letter-spacing: 0.045em;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
        }

        .studio-subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            color: #aaa59d;
            margin: 11px auto 0;
            letter-spacing: 0.02em;
        }

        /* ==================== REJILLA DE CARTAS MULTI-COLUMNA ==================== */
        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            width: 100%;
            max-width: 100%;
            padding: 0 10px;
        }

        /* ESCALAS DE COLUMNA DENSAS */
        .cards-grid.scale-35 .tcg-card {
            zoom: 0.35;
        }

        .cards-grid.scale-45 .tcg-card {
            zoom: 0.45;
        }

        .cards-grid.scale-60 .tcg-card {
            zoom: 0.60;
        }

        .cards-grid.scale-100 .tcg-card {
            zoom: 1.0;
        }

        /* ==================== CARTA HD (976px x 1360px) ==================== */
        .tcg-card {
            width: 976px;
            height: 1360px;
            border-radius: 48px;
            position: relative;
            isolation: isolate;
            background: #090a08;
            box-shadow: 0 36px 80px rgba(0, 0, 0, 0.9), 0 0 0 3px rgba(255, 255, 255, 0.08);
            overflow: visible;
            flex-shrink: 0;
        }

        /* MARCO EXTERIOR: VERDE NATURALEZA A GRIS ACERO (SIN MOTIVO) */
        .tcg-outer-border {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 48px;
            padding: 18px;
            background-image:
                var(--noise-tex),
                linear-gradient(180deg,
                    #536174 0%,
                    #414e60 42%,
                    #2d3948 72%,
                    #1b232e 100%);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
        }

        /* Estructura Interna */
        .tcg-inner {
            position: absolute;
            inset: 18px;
            z-index: 1;
            border-radius: 30px;
            overflow: hidden;
            background: var(--nature-bg);
            display: flex;
            flex-direction: column;
        }

        .tcg-inner::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 30px;
            box-shadow: inset 0 0 0 2px rgba(184, 162, 107, 0.4), inset 0 0 36px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            z-index: 2;
        }

        /* --- CABECERA DE CARTA --- */
        .tcg-head {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 24px;
            margin: 12px 12px 0 12px;
            border-radius: 18px 0 0 9px;
            background: transparent;
        }

        .tcg-head::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 18px 0 0 9px;
            background-image:
                var(--noise-tex),
                linear-gradient(90deg, #315b3a 0%, #1d4228 65%, transparent 98%);
            background-repeat: repeat, no-repeat;
            background-size: auto, 100% 100%;
            background-blend-mode: soft-light, normal;
            background-clip: padding-box;
            border-top: 3px solid rgba(184, 162, 107, 0.55);
            border-left: 3px solid rgba(184, 162, 107, 0.55);
            border-bottom: 3px solid rgba(184, 162, 107, 0.55);
            border-right: none;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 68%, transparent 95%);
            mask-image: linear-gradient(90deg, #000 0%, #000 68%, transparent 95%);
        }

        .tcg-head::after {
            content: "";
            position: absolute;
            inset: 3px 0 3px 3px;
            z-index: 0;
            border-radius: 15px 0 0 6px;
            background: url("./motivo.avif") center 38% / cover no-repeat;
            mix-blend-mode: multiply;
            opacity: 0.33;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 68%, transparent 95%);
            mask-image: linear-gradient(90deg, #000 0%, #000 68%, transparent 95%);
        }

        .tcg-title-wrap {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
            overflow: visible;
        }

        .tcg-element-icon {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(184, 162, 107, 0.38);
            border-radius: 50%;
            background:
                radial-gradient(circle at 38% 30%, rgba(112, 177, 125, 0.2), transparent 38%),
                linear-gradient(145deg, #173621, #0a1d10 72%);
            color: #78c690;
            font-size: 33px;
            box-shadow:
                inset 0 1px 0 rgba(235, 222, 174, 0.1),
                inset 0 -5px 9px rgba(0, 0, 0, 0.34),
                0 4px 9px rgba(0, 0, 0, 0.52),
                0 0 8px rgba(92, 160, 108, 0.14);
        }

        .tcg-title {
            flex: 1;
            min-width: 0;
            font-family: 'Lora', serif;
            font-size: 45px;
            font-weight: 700;
            color: #f2f5e8;
            letter-spacing: 1px;
            text-transform: capitalize;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.9);
        }

        /* ORBE DE COSTE AZUL, MISMO LENGUAJE VISUAL QUE LA ENERGÍA DEL JUEGO */
        .tcg-mana-gem {
            position: relative;
            isolation: isolate;
            width: 90px;
            height: 90px;
            overflow: hidden;
            flex-shrink: 0;
            border-radius: 50%;
            margin-top: -9px;
            margin-bottom: -9px;
            margin-right: 12px;
            margin-left: -9px;
            z-index: 15;
            background-image:
                var(--noise-tex),
                radial-gradient(circle at 36% 27%, rgba(213, 239, 242, 0.18), transparent 32%),
                linear-gradient(145deg, #47788a 0%, #285166 48%, #142c3c 100%);
            background-size: auto, 100% 100%, 100% 100%;
            background-blend-mode: soft-light, normal, normal;
            border: 4px solid rgba(137, 198, 213, 0.66);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 2px 4px rgba(222, 245, 247, 0.24),
                inset 0 -5px 8px rgba(3, 17, 28, 0.48),
                0 0 0 2px rgba(12, 27, 36, 0.9),
                0 6px 12px rgba(0, 0, 0, 0.52);
        }

        .tcg-mana-gem::before {
            content: none;
        }

        .tcg-mana-gem::after {
            content: "";
            position: absolute;
            inset: 8px;
            z-index: 2;
            border: 2px solid rgba(220, 205, 156, 0.24);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(113, 196, 197, 0.18);
            pointer-events: none;
        }

        .tcg-mana-gem span {
            position: relative;
            z-index: 4;
            font-family: 'Trebuchet MS', 'Outfit', sans-serif;
            font-size: 60px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #f6f3df;
            -webkit-text-stroke: 3px rgba(8, 25, 38, 0.98);
            paint-order: stroke fill;
            text-shadow:
                0 3px 4px rgba(2, 13, 24, 0.98),
                0 0 4px rgba(208, 228, 202, 0.28);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            margin: 0;
            transform: translateY(-1px);
        }

        .tcg-mana-gem span[data-cost="1"],
        .tcg-mana-gem span[data-cost="4"] {
            transform: translate(-1px, -1px);
        }

        /* --- MARCO Y VENTANA DE ARTE --- */
        .tcg-art-frame {
            position: relative;
            margin: 9px 12px;
            height: 560px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid rgba(184, 162, 107, 0.45);
            box-shadow: 0 9px 24px rgba(0, 0, 0, 0.8), inset 0 0 45px rgba(0, 0, 0, 0.6);
        }

        .tcg-art-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
        }

        .tcg-art-frame::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.55) 100%);
            pointer-events: none;
        }

        /* --- CINTA DE TIPO RIBBON CUT --- */
        .tcg-typeband {
            position: relative;
            z-index: 5;
            margin: 0 12px;
            padding: 12px 48px 12px 30px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.55) 0%, rgba(184, 162, 107, 0.45) 50%, rgba(138, 115, 55, 0.35) 100%);
            border: none;
            border-radius: 9px 0 0 9px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
            clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 50%, calc(100% - 30px) 100%, 0 100%);
        }

        .tcg-typeband::before {
            content: "";
            position: absolute;
            inset: 2px;
            z-index: 0;
            background-image:
                var(--noise-tex),
                linear-gradient(180deg, #305a38 0%, #214329 100%);
            background-repeat: repeat, no-repeat;
            background-size: auto, 100% 100%;
            background-blend-mode: soft-light, normal;
            border-radius: 7px 0 0 7px;
            clip-path: polygon(0 0, calc(100% - 29px) 0, 100% 50%, calc(100% - 29px) 100%, 0 100%);
        }

        .tcg-typeband::after {
            content: "";
            position: absolute;
            inset: 2px;
            z-index: 0;
            border-radius: 7px 0 0 7px;
            background: url("./motivo.avif") center 67% / cover no-repeat;
            mix-blend-mode: multiply;
            opacity: 0.33;
            pointer-events: none;
            clip-path: polygon(0 0, calc(100% - 29px) 0, 100% 50%, calc(100% - 29px) 100%, 0 100%);
        }

        .tcg-type-text {
            position: relative;
            z-index: 1;
            font-family: 'Lora', serif;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: capitalize;
            color: #eae4cf;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 18px;
        }

        /* --- CAJA DE TEXTO Y DESCRIPCIÓN --- */
        .tcg-type-text .fa-scroll {
            display: inline-block;
            font-size: 34px !important;
            transform: translateY(3px);
        }

        .tcg-type-text .tcg-echo-icon {
            display: block;
            width: 56px;
            height: 56px;
            flex: 0 0 56px;
            overflow: visible;
            color: #86efac;
        }

        .tcg-body {
            position: relative;
            flex: 1;
            margin: 9px 12px 12px;
            padding: 30px 36px 70px 36px;
            border-radius: 9px 9px 18px 18px;
            background-image:
                var(--noise-tex),
                var(--noise-tex),
                linear-gradient(180deg, #e6e3ce 0%, #d8dcc3 100%);
            background-blend-mode: multiply, multiply, normal;
            border: 3px solid rgba(184, 162, 107, 0.4);
            box-shadow: inset 0 6px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 18px;
            overflow: hidden;
        }

        /* MARCA DE AGUA "H" EN EL FONDO */
        .tcg-body::before {
            content: "H";
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Cinzel Decorative', serif;
            font-size: 350px;
            font-weight: 700;
            color: rgba(45, 80, 50, 0.08);
            pointer-events: none;
            z-index: 0;
        }

        .tcg-effect {
            position: relative;
            z-index: 1;
            font-family: 'Lora', serif;
            font-size: 46px;
            line-height: 1.48;
            color: #1a1e16;
            margin: 0;
            font-weight: 500;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
            text-align: left;
            width: 100%;
        }

        .tcg-effect strong {
            color: #14532d;
            font-weight: 700;
        }

        .effect-paragraph {
            display: block;
        }

        .effect-paragraph + .effect-paragraph {
            margin-top: 0.36em;
        }

        .effect-keyword,
        .effect-action,
        .effect-counter,
        .effect-token,
        .effect-stat {
            color: #14532d;
            font-weight: 700;
        }

        .effect-action {
            font-weight: 800;
        }

        .effect-keyword-value {
            display: inline-grid;
            width: 1.55em;
            height: 1.55em;
            margin-left: 0.14em;
            place-items: center;
            border: 2px solid rgba(184, 162, 107, 0.78);
            border-radius: 50%;
            color: #f3eedc;
            background-color: #174e2b;
            background-image: var(--noise-tex);
            background-blend-mode: soft-light;
            box-shadow: inset 0 0 0 1px rgba(222, 238, 196, 0.18);
            font-family: "Outfit", sans-serif;
            font-size: 0.64em;
            line-height: 1;
            vertical-align: 0.08em;
        }

        .tcg-effect strong.effect-danger {
            color: #b91c1c !important;
            font-weight: 800;
        }

        /* ICONOS DE EFECTO (Tapar / Energía) */
        .symbol-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin: 0 8px;
            vertical-align: middle;
            transform: translateY(-5px);
            /* Alineación óptica exacta en medio del texto */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .symbol-tap {
            background:
                radial-gradient(circle at 36% 27%, rgba(242, 229, 191, 0.18), transparent 32%),
                linear-gradient(145deg, #665b43 0%, #403a2d 48%, #211f1a 100%);
            border: 3px solid rgba(184, 162, 107, 0.66);
            color: #eadcae;
            font-size: 27px;
            text-shadow: 0 1px 2px rgba(13, 10, 6, 0.95);
            box-shadow:
                inset 0 1px 2px rgba(255, 242, 204, 0.24),
                inset 0 -3px 5px rgba(16, 12, 7, 0.48),
                0 3px 7px rgba(0, 0, 0, 0.42);
        }

        .symbol-energy {
            background:
                radial-gradient(circle at 36% 27%, rgba(242, 229, 191, 0.18), transparent 32%),
                linear-gradient(145deg, #665b43 0%, #403a2d 48%, #211f1a 100%);
            border: 3px solid rgba(184, 162, 107, 0.66);
            color: #f6d76f;
            font-size: 29px;
            text-shadow: 0 1px 2px rgba(13, 10, 6, 0.95);
            box-shadow:
                inset 0 1px 2px rgba(255, 242, 204, 0.24),
                inset 0 -3px 5px rgba(16, 12, 7, 0.48),
                0 3px 7px rgba(0, 0, 0, 0.42);
        }

        .symbol-badge > svg {
            display: block;
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        .tcg-divider {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 3px;
            min-height: 3px;
            flex: 0 0 3px;
            margin: 12px 0;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(52, 96, 59, 0.45) 25%,
                    rgba(52, 96, 59, 0.45) 47%,
                    transparent 47%,
                    transparent 53%,
                    rgba(52, 96, 59, 0.45) 53%,
                    rgba(52, 96, 59, 0.45) 75%,
                    transparent 100%);
        }

        .tcg-divider::after {
            content: "◆";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 21px;
            color: #386b40;
            line-height: 1;
            background: transparent;
            padding: 0;
        }

        .tcg-flavor {
            position: relative;
            z-index: 1;
            font-family: 'Lora', serif;
            font-style: normal;
            font-size: 48px;
            font-weight: 500;
            line-height: 1.45;
            color: #454e40;
            margin: 0;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5);
            text-align: left;
            width: 100%;
        }

        .tcg-flavor-solo {
            font-size: 48px;
            line-height: 1.48;
            color: #353f31;
        }

        .tcg-footer-info {
            position: absolute;
            left: 30px;
            bottom: 18px;
            z-index: 1;
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            letter-spacing: 3px;
            color: rgba(60, 74, 55, 0.55);
            text-transform: uppercase;
        }

        /* --- VARIANTE FULL ART PARA TIERRAS --- */
        .tcg-card--full-art-land .tcg-inner {
            background: #0a100c;
        }

        .tcg-card--full-art-land .tcg-art-frame {
            position: absolute;
            top: 101px;
            right: 12px;
            bottom: 92px;
            left: 12px;
            z-index: 0;
            height: auto;
            margin: 0;
            border: 3px solid rgba(184, 162, 107, 0.45);
            border-radius: 15px 15px 18px 18px;
            box-shadow:
                0 9px 24px rgba(0, 0, 0, 0.8),
                inset 0 0 45px rgba(0, 0, 0, 0.6);
        }

        .tcg-card--full-art-land .tcg-art-image {
            object-position: center center;
        }

        .tcg-card--full-art-land .tcg-art-frame::after {
            background: linear-gradient(180deg,
                rgba(0, 0, 0, 0.04) 0%,
                transparent 68%,
                rgba(3, 8, 5, 0.18) 84%,
                rgba(3, 8, 5, 0.52) 100%);
        }

        .tcg-card--full-art-land .tcg-typeband {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 7;
            margin: 0;
            padding-right: 30px;
            border-radius: 9px;
            clip-path: none;
        }

        .tcg-card--full-art-land .tcg-typeband::before {
            border-radius: 7px;
            clip-path: none;
        }

        .tcg-card--full-art-land .tcg-typeband::after {
            border-radius: 7px;
            clip-path: none;
        }

        .tcg-card--full-art-land .tcg-body {
            display: none;
        }

        /* --- STATS BADGE HD --- */
        .tcg-stats-badge {
            position: absolute;
            isolation: isolate;
            right: 2px;
            bottom: 2px;
            z-index: 25;
            display: flex;
            width: auto;
            min-width: 198px;
            height: 90px;
            overflow: hidden;
            align-items: center;
            justify-content: center;
            gap: 11px;
            padding: 0 29px 0 25px;
            border: 0;
            border-radius: 30px 0 25px 0;
            background-image:
                var(--noise-tex),
                linear-gradient(180deg, #305a38 0%, #214329 54%, #0a1c0e 100%);
            background-position: center, center;
            background-size: auto, 100% 100%;
            background-blend-mode: soft-light, normal;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -3px 5px rgba(0, 0, 0, 0.34),
                0 3px 8px rgba(0, 0, 0, 0.52);
            font-family: 'Trebuchet MS', 'Outfit', sans-serif;
        }

        .tcg-stats-badge::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: url("./motivo.avif") center 58% / cover no-repeat;
            mix-blend-mode: multiply;
            opacity: 0.33;
            pointer-events: none;
        }

        .tcg-stats-badge::after {
            content: "";
            position: absolute;
            inset: 2px;
            z-index: 2;
            border: 2px solid rgba(201, 177, 111, 0.48);
            border-radius: 28px 0 23px 0;
            pointer-events: none;
        }

        .tcg-stat-item {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tcg-stat-icon {
            font-size: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.8));
        }

        .tcg-stat-atk .tcg-stat-icon {
            color: #c9aa66;
        }

        .tcg-stat-atk .tcg-stat-icon svg {
            stroke-width: 2.35;
        }

        .tcg-stat-def .tcg-stat-icon {
            color: #df7d7a;
        }

        .tcg-stat-val {
            font-family: 'Trebuchet MS', 'Outfit', sans-serif;
            font-size: 51px;
            font-weight: 950;
            line-height: 1;
            color: #f2f0e6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.86);
        }

        .tcg-stat-sep {
            position: relative;
            z-index: 3;
            color: #94a3b8;
            font-family: 'Trebuchet MS', 'Outfit', sans-serif;
            font-size: 38px;
            font-weight: 600;
            margin: 0 3px;
        }
    </style>
</head>

<body>

    <!-- CONTENEDOR DE TODAS LAS CARTAS EN MULTI-COLUMNA -->
    <div class="cards-grid scale-45" id="cards-container">

    </div>

    <script src="../deck-card-text.js"></script>
    <script>
        // Datos del Deck Mono Green extraídos directamente de mono-green.json
        const deckData = [
            {

                "lore": "Cada raíz de Llanowar es un sendero y cada hoja, una advertencia."
            },
            {
                "id": "sunshower_druid",

                "tipo": "Eco — Rana Druida",

            {

                "lore": "Bajo la capucha guarda secretos que el bosque solo confía a los pacientes."
            },
            {
                "id": "ichorspit_basilisk",
                "art_crop": "../../../../public/cards/mono_green_ramp/art/ichorspit_basilisk.jpg",
                "nombre": "Basilisco escupeicor",
                "tipo": "Eco — Pirexiano Basilisco",
                "costo": 3,
                "atk": 1,
                "def": 3,
                "desc": "Letal\nVeneno 1",
                "lore": "Su veneno no mata de inmediato; primero transforma la sangre en obediencia."
            },
            {
                "id": "beast_kin_ranger",
                "art_crop": "../../../../public/cards/mono_green_ramp/art/beast_kin_ranger.jpg",
                "nombre": "Guardabosque bestial",
                "tipo": "Eco — Elfo Explorador",
                "costo": 3,
                "atk": 3,
                "def": 3,
                "desc": "Cada vez que otro aliado sea invocado, esta carta gana +1/+0 hasta el final del turno.",
                "lore": "No dirige a las bestias. Corre a su lado y comparte su furia."
            },
            {
                "id": "magnigoth_sentry",
                "art_crop": "../../../../public/cards/mono_green_ramp/art/magnigoth_sentry.jpg",
                "nombre": "Centinela mágnigoth",
                "tipo": "Eco — Pueblo-arbóreo",
                "costo": 4,

            {

            {

            {

            {

                "costo": 3,

            {

                "art_crop": "../../../../public/cards/mono_green_ramp/art/giant_growth.jpg",

            {

        ];

        // Función para formatear el texto de descripción y reemplazar {E} por el ícono de Energía
        function formatEffectText(text) {
            const energyIcon = `<span class="symbol-badge symbol-energy" title="Energía"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"></path></svg></span>`;
            return window.HostfallCardText.formatEffectText(text, {
                energyIconHtml: energyIcon,
            });
        }

        // Determinar ícono de tipo
        function getTypeIcon(tipo) {
            if (tipo.includes("Eco")) return `
                <svg class="tcg-echo-icon" aria-hidden="true" focusable="false" viewBox="0 0 64 64">
                    <path fill="currentColor" d="M32 20 39 32 32 44 25 32 32 20Z"></path>
                    <path fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" d="M20.5 22.5A15 15 0 0 0 20.5 41.5M43.5 22.5A15 15 0 0 1 43.5 41.5M12.5 15A26 26 0 0 0 12.5 49M51.5 15A26 26 0 0 1 51.5 49"></path>
                </svg>
            `;
            if (tipo.includes("Hechizo")) return '<i class="fa-solid fa-scroll" style="font-size: 28px; color: #86efac;"></i>';
            if (tipo.includes("Fuente")) return '<i class="fa-solid fa-gem" style="font-size: 28px; color: #86efac;"></i>';
            return '<i class="fa-solid fa-gem" style="font-size: 28px; color: #86efac;"></i>';
        }

        // Renderizado de las cartas
        const container = document.getElementById('cards-container');

        deckData.forEach((card, index) => {
            const hasStats = card.atk !== null && card.def !== null;
            const cardNumberStr = String(index + 1).padStart(3, '0');

            const hasEffect = card.desc && card.desc.trim() !== "" && card.desc.trim().toLowerCase() !== "sin efecto adicional.";
            const hasLore = card.lore && card.lore.trim() !== "";
            const isSource = card.tipo && card.tipo.toLowerCase().includes("fuente");

            const cardEl = document.createElement('div');
            cardEl.className = `tcg-card${isSource ? ' tcg-card--full-art-land' : ''}`;
            cardEl.id = `card-${card.id}`;

            cardEl.innerHTML = `
                <div class="tcg-outer-border"></div>
                <div class="tcg-inner">
                    <!-- Cabecera -->
                    <div class="tcg-head">
                        ${!isSource ? `<div class="tcg-mana-gem"><span data-cost="${card.costo}">${card.costo}</span></div>` : ''}
                        <div class="tcg-title-wrap">
                            <div class="tcg-title">${card.nombre}</div>
                            <div class="tcg-element-icon"><i class="fa-solid fa-leaf"></i></div>
                        </div>
                    </div>

                    <!-- Ventana de Arte -->
                    <div class="tcg-art-frame">
                        <img src="${card.art_crop}" alt="${card.nombre}" class="tcg-art-image">
                    </div>

                    <!-- Banda de Tipo -->
                    <div class="tcg-typeband">
                        <div class="tcg-type-text">
                            ${getTypeIcon(card.tipo)}
                            ${card.tipo}
                        </div>
                    </div>

                    <!-- Cuerpo de Descripción -->
                    <div class="tcg-body">
                        ${(!isSource && hasEffect) ? `<p class="tcg-effect">${formatEffectText(card.desc)}</p>` : ''}
                        ${(!isSource && hasEffect && hasLore) ? `<div class="tcg-divider"></div>` : ''}
                        ${(isSource || !hasEffect) && hasLore ? `<p class="tcg-flavor tcg-flavor-solo">${card.lore}</p>` : (!isSource && hasLore ? `<p class="tcg-flavor ${hasEffect ? '' : 'tcg-flavor-solo'}">${card.lore}</p>` : '')}
                        <div class="tcg-footer-info">HFA1 #${cardNumberStr} • © HOSTFALL 2026</div>
                    </div>
                </div>

                <!-- Stats (Ataque / Defensa) si aplica -->
                ${hasStats ? `
                <div class="tcg-stats-badge">
                    <div class="tcg-stat-item tcg-stat-atk">
                        <span class="tcg-stat-val">${card.atk}</span>
                    </div>
                    <span class="tcg-stat-sep">/</span>
                    <div class="tcg-stat-item tcg-stat-def">
                        <span class="tcg-stat-val">${card.def}</span>
                    </div>
                </div>
                ` : ''}
            `;

            container.appendChild(cardEl);
        });

        if (window.lucide) lucide.createIcons();

    </script>
</body>

</html>
