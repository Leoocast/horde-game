<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunshower Druid — Full Art Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

    :root {
      --gold-light: #f0e2b6;
      --gold-main: #c5a059;
      --gold-dark: #8b6d3b;
      --slate-deep: #0d1320;
      --slate-mid: #1b2536;
      --steel: #33445e;
      --gem-core: #3b6fd4;
      --gem-dark: #1e3d7a;
      --text-bright: #eef2f7;
      --text-silver: #c8d2df;
      --text-dim: #97a4b6;
    }

    body {
      background: #10141c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Lora', serif;
    }

    .card {
      width: 400px;
      height: 570px;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85), 0 0 22px rgba(197, 160, 89, 0.12);
      background-color: var(--slate-mid);
      background-image: url('image.png');
      background-size: cover;
      background-position: center 20%;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
          rgba(9, 14, 24, 0.88) 0%,
          rgba(9, 14, 24, 0.35) 14%,
          rgba(9, 14, 24, 0) 30%,
          rgba(9, 14, 24, 0) 44%,
          rgba(8, 12, 21, 0.72) 62%,
          rgba(6, 10, 18, 0.96) 76%,
          rgba(5, 8, 15, 1) 100%);
      z-index: 1;
    }

    .inner-border {
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(240, 226, 182, 0.45);
      border-radius: 9px;
      pointer-events: none;
      z-index: 3;
    }

    .inner-border-2 {
      position: absolute;
      inset: 11px;
      border: 1px solid rgba(197, 160, 89, 0.18);
      border-radius: 7px;
      pointer-events: none;
      z-index: 3;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .type-icon {
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(13, 19, 32, 0.78);
      border-radius: 50%;
      border: 1px solid var(--gold-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
    }

    .type-icon svg {
      width: 20px;
      height: 20px;
      fill: var(--gold-light);
    }

    .title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      margin: 0 10px;
    }

    .title {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.9);
    }

    .title-divider {
      margin-top: 3px;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      color: var(--text-silver);
      font-size: 10.5px;
      letter-spacing: 2px;
      margin-top: 3px;
      text-transform: uppercase;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
    }

    .cost {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle at 30% 25%, #5a7396, #253449);
      border: 1.5px solid var(--gold-light);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 21px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .spacer {
      flex: 1;
    }

    .winged-divider {
      display: block;
      margin-bottom: 6px;
      width: 100%;
    }

    .text-box {
      text-align: center;
      padding: 0 12px;
    }

    .effect {
      color: var(--text-bright);
      font-size: 15px;
      line-height: 1.6;
      font-weight: 500;
      margin: 0 0 12px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    .flavor {
      color: var(--text-dim);
      font-style: italic;
      font-size: 12px;
      line-height: 1.55;
      margin: 10px 6px 0;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 16px;
    }

    .credits {
      color: rgba(151, 164, 182, 0.6);
      font-size: 8.5px;
      font-family: sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      gap: 8px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(13, 19, 32, 0.88);
      border: 1px solid var(--gold-main);
      border-radius: 6px;
      padding: 3px 10px;
      color: var(--text-bright);
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.6);
    }

    .stat svg {
      width: 14px;
      height: 14px;
      fill: var(--gold-main);
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="card-overlay"></div>
    <div class="inner-border"></div>
    <div class="inner-border-2"></div>

    <div class="content">
      <div class="header">
        <div class="type-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12,3.25C12,3.25 6,10 6,14C6,17.32 8.69,20 12,20A6,6 0 0,0 18,14C18,10 12,3.25 12,3.25Z" />
          </svg>
        </div>
        <div class="title-container">
          <div class="title">SUNSHOWER DRUID</div>
          <svg class="title-divider" viewBox="0 0 220 14" width="220" height="14">
            <line x1="6" y1="7" x2="86" y2="7" stroke="#c5a059" stroke-width="1" />
            <line x1="134" y1="7" x2="214" y2="7" stroke="#c5a059" stroke-width="1" />
            <circle cx="94" cy="7" r="1.6" fill="#c5a059" />
            <circle cx="126" cy="7" r="1.6" fill="#c5a059" />
            <rect x="105" y="2" width="10" height="10" transform="rotate(45 110 7)" fill="#1e3d7a" stroke="#f0e2b6"
              stroke-width="1" />
            <rect x="107.5" y="4.5" width="5" height="5" transform="rotate(45 110 7)" fill="#3b6fd4" />
          </svg>
          <div class="subtitle">Creature — Frog Druid</div>
        </div>
        <div class="cost">1</div>
      </div>

      <div class="spacer"></div>

      <svg class="winged-divider" viewBox="0 0 340 42" height="42">
        <line x1="10" y1="30" x2="118" y2="30" stroke="#c5a059" stroke-width="1" />
        <line x1="222" y1="30" x2="330" y2="30" stroke="#c5a059" stroke-width="1" />
        <circle cx="126" cy="30" r="1.5" fill="#c5a059" />
        <circle cx="133" cy="30" r="1" fill="#c5a059" />
        <circle cx="214" cy="30" r="1.5" fill="#c5a059" />
        <circle cx="207" cy="30" r="1" fill="#c5a059" />
        <path d="M160 30 C150 28 142 22 136 13 C146 17 154 22 160 27 Z" fill="none" stroke="#e8d49a"
          stroke-width="1.2" />
        <path d="M158 30 C151 30 145 27 140 22 C147 24 153 27 158 29 Z" fill="none" stroke="#c5a059" stroke-width="1" />
        <path d="M180 30 C190 28 198 22 204 13 C194 17 186 22 180 27 Z" fill="none" stroke="#e8d49a"
          stroke-width="1.2" />
        <path d="M182 30 C189 30 195 27 200 22 C193 24 187 27 182 29 Z" fill="none" stroke="#c5a059" stroke-width="1" />
        <rect x="164" y="20" width="12" height="12" transform="rotate(45 170 26)" fill="#1e3d7a" stroke="#f0e2b6"
          stroke-width="1.2" />
        <rect x="167" y="23" width="6" height="6" transform="rotate(45 170 26)" fill="#3b6fd4" />
      </svg>

      <div class="text-box">
        <p class="effect">When Sunshower Druid enters, put a +1/+1 counter on target creature and you gain 1 life.</p>

        <svg viewBox="0 0 260 16" width="240" height="15">
          <line x1="8" y1="8" x2="102" y2="8" stroke="#c5a059" stroke-width="0.8" />
          <line x1="158" y1="8" x2="252" y2="8" stroke="#c5a059" stroke-width="0.8" />
          <circle cx="110" cy="8" r="1.4" fill="#c5a059" />
          <circle cx="150" cy="8" r="1.4" fill="#c5a059" />
          <rect x="125" y="3" width="10" height="10" transform="rotate(45 130 8)" fill="none" stroke="#c5a059"
            stroke-width="1" />
          <circle cx="130" cy="8" r="2" fill="#3b6fd4" />
        </svg>

        <p class="flavor">Apprentice augurs begin their studies by predicting where the rain will fall. Even those who
          don't succeed derive great joy from the process.</p>
      </div>

      <div class="footer">
        <div class="credits">TXW 2/50 · Artist: —</div>
        <div class="stats">
          <div class="stat">
            <svg viewBox="0 0 24 24">
              <path
                d="M6.92,14.22L15.41,5.73L16.83,4.32L19.66,1.49L22.49,4.32L19.66,7.15L18.24,8.57L9.76,17.06L6.92,14.22M4.1,17.05L2.68,18.46L1.27,19.88L4.1,22.71L5.51,21.29L6.93,19.88L4.1,17.05M5.51,12.81L11.17,18.46L8.34,21.3L2.68,15.63L5.51,12.81Z" />
            </svg>
            0
          </div>
          <div class="stat">
            <svg viewBox="0 0 24 24">
              <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1Z" />
            </svg>
            2
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
