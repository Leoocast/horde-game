<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshower Druid — Full Art Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

        :root {
            --gold-light: #f0e2b6;
            --gold-main: #c5a059;
            --slate-frame: #141a26;
            --slate-mid: #1b2536;
            --gem-core: #3b6fd4;
            --gem-dark: #1e3d7a;
            --text-bright: #eef2f7;
            --text-silver: #c8d2df;
            --text-dim: #97a4b6;
        }

        body {
            background: #10141c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Lora', serif;
        }

        /* Marco exterior tipo TCG */
        .card {
            width: 400px;
            height: 590px;
            background: var(--slate-frame);
            border: 1px solid var(--gold-main);
            border-radius: 18px;
            padding: 12px 12px 6px;
            box-sizing: border-box;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85), inset 0 0 0 3px rgba(197, 160, 89, 0.12);
            display: flex;
            flex-direction: column;
        }

        /* Ventana de arte / contenido */
        .art {
            position: relative;
            flex: 1;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid rgba(240, 226, 182, 0.55);
            background-color: var(--slate-mid);
            background-image: url('image.png');
            background-size: cover;
            background-position: center 20%;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(9, 14, 24, 0.88) 0%,
                    rgba(9, 14, 24, 0.35) 14%,
                    rgba(9, 14, 24, 0) 30%,
                    rgba(9, 14, 24, 0) 44%,
                    rgba(8, 12, 21, 0.72) 62%,
                    rgba(6, 10, 18, 0.96) 76%,
                    rgba(5, 8, 15, 1) 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .type-icon {
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(13, 19, 32, 0.78);
            border-radius: 50%;
            border: 1px solid var(--gold-main);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
            flex-shrink: 0;
        }

        .type-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--gold-light);
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            margin: 0 10px;
        }

        .title {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            color: var(--text-silver);
            font-size: 10.5px;
            letter-spacing: 2px;
            margin-top: 3px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }

        .cost {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 25%, #5a7396, #253449);
            border: 1.5px solid var(--gold-light);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 21px;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        .spacer {
            flex: 1;
        }

        .divider {
            display: block;
            margin: 0 auto 10px;
        }

        .text-box {
            text-align: left;
            padding: 0 8px;
        }

        .effect {
            color: var(--text-bright);
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            margin: 0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        }

        .flavor {
            color: var(--text-dim);
            font-style: italic;
            font-size: 12px;
            line-height: 1.55;
            margin: 6px 0 0;
        }

        .footer {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            margin-top: 14px;
        }

        .stats {
            display: flex;
            gap: 8px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(13, 19, 32, 0.88);
            border: 1px solid var(--gold-main);
            border-radius: 6px;
            padding: 3px 10px;
            color: var(--text-bright);
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.6);
        }

        .stat svg {
            width: 14px;
            height: 14px;
            fill: var(--gold-main);
        }

        /* Franja inferior del marco, como en cartas reales */
        .frame-strip {
            height: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
            color: rgba(151, 164, 182, 0.55);
            font-size: 8.5px;
            font-family: sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="art">
            <div class="card-overlay"></div>

            <div class="content">
                <div class="header">
                    <div class="type-icon">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12,3.25C12,3.25 6,10 6,14C6,17.32 8.69,20 12,20A6,6 0 0,0 18,14C18,10 12,3.25 12,3.25Z" />
                        </svg>
                    </div>
                    <div class="title-container">
                        <div class="title">SUNSHOWER DRUID</div>
                        <svg viewBox="0 0 200 10" width="200" height="10" style="margin-top: 3px;">
                            <line x1="10" y1="5" x2="91" y2="5" stroke="#c5a059" stroke-width="0.8" />
                            <line x1="109" y1="5" x2="190" y2="5" stroke="#c5a059" stroke-width="0.8" />
                            <rect x="97" y="2" width="6" height="6" transform="rotate(45 100 5)" fill="none"
                                stroke="#c5a059" stroke-width="0.9" />
                            <circle cx="100" cy="5" r="1.4" fill="#3b6fd4" />
                        </svg>
                        <div class="subtitle">Creature — Frog Druid</div>
                    </div>
                    <div class="cost">1</div>
                </div>

                <div class="spacer"></div>

                <svg class="divider" viewBox="0 0 320 12" width="320" height="12">
                    <line x1="8" y1="6" x2="147" y2="6" stroke="#c5a059" stroke-width="0.8" />
                    <line x1="173" y1="6" x2="312" y2="6" stroke="#c5a059" stroke-width="0.8" />
                    <rect x="156" y="2" width="8" height="8" transform="rotate(45 160 6)" fill="#1e3d7a"
                        stroke="#f0e2b6" stroke-width="0.9" />
                    <circle cx="160" cy="6" r="1.6" fill="#3b6fd4" />
                </svg>

                <div class="text-box">
                    <p class="effect">When Sunshower Druid enters, put a +1/+1 counter on target creature and you gain 1
                        life.</p>
                    <p class="flavor">Apprentice augurs begin their studies by predicting where the rain will fall. Even
                        those who don't succeed derive great joy from the process.</p>
                </div>

                <div class="footer">
                    <div class="stats">
                        <div class="stat">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M6.92,14.22L15.41,5.73L16.83,4.32L19.66,1.49L22.49,4.32L19.66,7.15L18.24,8.57L9.76,17.06L6.92,14.22M4.1,17.05L2.68,18.46L1.27,19.88L4.1,22.71L5.51,21.29L6.93,19.88L4.1,17.05M5.51,12.81L11.17,18.46L8.34,21.3L2.68,15.63L5.51,12.81Z" />
                            </svg>
                            0
                        </div>
                        <div class="stat">
                            <svg viewBox="0 0 24 24">
                                <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1Z" />
                            </svg>
                            2
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="frame-strip">
            <span>TXW 2/50</span>
            <span>Artist: —</span>
        </div>
    </div>

</body>

</html>
