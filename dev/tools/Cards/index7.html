<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshower Druid — Full Art Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

        :root {
            --gold-light: #f0e2b6;
            --gold-main: #c5a059;
            --gold-faint: rgba(197, 160, 89, 0.22);
            --slate-deep: #0d1320;
            --slate-mid: #1b2536;
            --gem-core: #3b6fd4;
            --gem-dark: #1e3d7a;
            --panel: rgba(13, 19, 32, 0.72);
            --text-bright: #eef2f7;
            --text-silver: #c8d2df;
            --text-dim: #97a4b6;
        }

        body {
            background: #10141c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Lora', serif;
        }

        .card {
            width: 400px;
            height: 580px;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85), 0 0 22px rgba(197, 160, 89, 0.12);
            background-color: var(--slate-mid);
            background-image: url('image.png');
            background-size: cover;
            background-position: center 20%;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(9, 14, 24, 0.88) 0%,
                    rgba(9, 14, 24, 0.35) 14%,
                    rgba(9, 14, 24, 0) 30%,
                    rgba(9, 14, 24, 0) 44%,
                    rgba(8, 12, 21, 0.72) 62%,
                    rgba(6, 10, 18, 0.96) 76%,
                    rgba(5, 8, 15, 1) 100%);
            z-index: 1;
        }

        /* Borde doble redondeado */
        .inner-border {
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(240, 226, 182, 0.45);
            border-radius: 9px;
            pointer-events: none;
            z-index: 3;
        }

        .inner-border-2 {
            position: absolute;
            inset: 11px;
            border: 1px solid rgba(197, 160, 89, 0.18);
            border-radius: 7px;
            pointer-events: none;
            z-index: 3;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 22px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .type-icon {
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--panel);
            border-radius: 50%;
            border: 1px solid var(--gold-main);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
            flex-shrink: 0;
        }

        .type-icon svg {
            width: 19px;
            height: 19px;
            fill: var(--gold-light);
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            margin: 0 12px;
        }

        .eyebrow {
            font-family: 'Lora', serif;
            color: var(--text-dim);
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }

        .title {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 2px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.9);
        }

        /* Costo en rombo con zafiro de fondo */
        .cost {
            width: 32px;
            height: 32px;
            margin: 4px;
            background: radial-gradient(circle at 30% 25%, #33518f, #16233f);
            border: 1px solid var(--gold-light);
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
        }

        .cost span {
            transform: rotate(-45deg);
            color: var(--gold-light);
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
        }

        .spacer {
            flex: 1;
        }

        .divider {
            display: block;
            margin: 0 auto 12px;
        }

        /* Panel de texto con hairline */
        .text-box {
            text-align: left;
            background: var(--panel);
            border: 1px solid var(--gold-faint);
            border-radius: 7px;
            padding: 12px 14px;
        }

        .effect {
            color: var(--text-bright);
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            margin: 0;
        }

        .flavor {
            color: var(--text-dim);
            font-style: italic;
            font-size: 12px;
            line-height: 1.55;
            margin: 6px 0 0;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .credits {
            color: rgba(151, 164, 182, 0.55);
            font-size: 8.5px;
            font-family: 'Lora', serif;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Placa unificada de ataque / defensa */
        .combat {
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--panel);
            border: 1px solid var(--gold-main);
            border-radius: 7px;
            padding: 5px 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.6);
        }

        .combat svg {
            width: 14px;
            height: 14px;
            fill: var(--gold-main);
        }

        .combat .value {
            font-family: 'Cinzel', serif;
            color: var(--text-bright);
            font-size: 16px;
            font-weight: 700;
        }

        .combat .sep {
            width: 6px;
            height: 6px;
            background: var(--gem-core);
            border: 1px solid var(--gold-light);
            transform: rotate(45deg);
            margin: 0 2px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-overlay"></div>
        <div class="inner-border"></div>
        <div class="inner-border-2"></div>

        <div class="content">
            <div class="header">
                <div class="type-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,3.25C12,3.25 6,10 6,14C6,17.32 8.69,20 12,20A6,6 0 0,0 18,14C18,10 12,3.25 12,3.25Z" />
                    </svg>
                </div>
                <div class="title-container">
                    <div class="eyebrow">Creature — Frog Druid</div>
                    <div class="title">SUNSHOWER DRUID</div>
                    <svg viewBox="0 0 200 10" width="200" height="10" style="margin-top: 3px;">
                        <line x1="10" y1="5" x2="88" y2="5" stroke="#c5a059" stroke-width="0.8" opacity="0.8" />
                        <line x1="112" y1="5" x2="190" y2="5" stroke="#c5a059" stroke-width="0.8" opacity="0.8" />
                        <circle cx="94" cy="5" r="1" fill="#c5a059" />
                        <circle cx="106" cy="5" r="1" fill="#c5a059" />
                        <rect x="97" y="2" width="6" height="6" transform="rotate(45 100 5)" fill="#1e3d7a"
                            stroke="#f0e2b6" stroke-width="0.9" />
                        <circle cx="100" cy="5" r="1.3" fill="#3b6fd4" />
                    </svg>
                </div>
                <div class="cost"><span>1</span></div>
            </div>

            <div class="spacer"></div>

            <svg class="divider" viewBox="0 0 320 12" width="320" height="12">
                <line x1="8" y1="6" x2="140" y2="6" stroke="#c5a059" stroke-width="0.8" opacity="0.8" />
                <line x1="180" y1="6" x2="312" y2="6" stroke="#c5a059" stroke-width="0.8" opacity="0.8" />
                <circle cx="147" cy="6" r="1" fill="#c5a059" />
                <circle cx="173" cy="6" r="1" fill="#c5a059" />
                <rect x="156" y="2" width="8" height="8" transform="rotate(45 160 6)" fill="#1e3d7a" stroke="#f0e2b6"
                    stroke-width="0.9" />
                <circle cx="160" cy="6" r="1.6" fill="#3b6fd4" />
            </svg>

            <div class="text-box">
                <p class="effect">When Sunshower Druid enters, put a +1/+1 counter on target creature and you gain 1
                    life.</p>
                <p class="flavor">Apprentice augurs begin their studies by predicting where the rain will fall. Even
                    those who don't succeed derive great joy from the process.</p>
            </div>

            <div class="footer">
                <div class="credits">TXW 2/50</div>
                <div class="combat">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M6.92,14.22L15.41,5.73L16.83,4.32L19.66,1.49L22.49,4.32L19.66,7.15L18.24,8.57L9.76,17.06L6.92,14.22M4.1,17.05L2.68,18.46L1.27,19.88L4.1,22.71L5.51,21.29L6.93,19.88L4.1,17.05M5.51,12.81L11.17,18.46L8.34,21.3L2.68,15.63L5.51,12.81Z" />
                    </svg>
                    <span class="value">0</span>
                    <span class="sep"></span>
                    <span class="value">2</span>
                    <svg viewBox="0 0 24 24">
                        <path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1Z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
