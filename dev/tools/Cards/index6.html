<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshower Druid — Hostfall Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

        :root {
            --gold-light: #ead9a8;
            --gold-main: #b8a26b;
            --gold-line: rgba(184, 162, 107, 0.45);
            --gold-faint: rgba(184, 162, 107, 0.18);
            --ink: #0e0f0d;
            --panel: rgba(12, 12, 10, 0.62);
            --text-bright: #efece1;
            --text-dim: #9a9a8e;
        }

        body {
            background: #0b0c0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Lora', serif;
        }

        .card {
            width: 400px;
            height: 580px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.9);
            background-color: #14150f;
            background-image: url('image.png');
            background-size: cover;
            background-position: center 20%;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(13, 13, 11, 0.92) 0%,
                    rgba(13, 13, 11, 0.42) 14%,
                    rgba(13, 13, 11, 0) 30%,
                    rgba(13, 13, 11, 0) 42%,
                    rgba(12, 12, 10, 0.78) 60%,
                    rgba(11, 11, 9, 0.97) 74%,
                    rgba(10, 10, 8, 1) 100%);
            z-index: 1;
        }

        .inner-border {
            position: absolute;
            inset: 8px;
            border: 1px solid var(--gold-line);
            border-radius: 3px;
            pointer-events: none;
            z-index: 3;
        }

        .inner-border-2 {
            position: absolute;
            inset: 12px;
            border: 1px solid var(--gold-faint);
            border-radius: 2px;
            pointer-events: none;
            z-index: 3;
        }

        .corner {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--gold-main);
            transform: rotate(45deg);
            z-index: 4;
        }

        .corner.tl {
            top: 5.5px;
            left: 5.5px;
        }

        .corner.tr {
            top: 5.5px;
            right: 5.5px;
        }

        .corner.bl {
            bottom: 5.5px;
            left: 5.5px;
        }

        .corner.br {
            bottom: 5.5px;
            right: 5.5px;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Botón cuadrado tipo UI (como los de SFX del juego) */
        .type-icon {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--gold-line);
            border-radius: 3px;
            flex-shrink: 0;
        }

        .type-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--gold-light);
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            margin: 0 12px;
        }

        .eyebrow {
            font-family: 'Lora', serif;
            color: var(--text-dim);
            font-size: 8.5px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }

        .title {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 2.5px;
            margin-top: 2px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.95);
        }

        /* Costo como rombo, motivo del juego */
        .cost {
            width: 32px;
            height: 32px;
            margin: 3px;
            background: #191a13;
            border: 1px solid var(--gold-light);
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
        }

        .cost span {
            transform: rotate(-45deg);
            color: var(--gold-light);
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
        }

        .spacer {
            flex: 1;
        }

        .divider {
            display: block;
            margin: 0 auto 12px;
        }

        /* Panel de texto con hairline, como los paneles del modal */
        .text-box {
            text-align: left;
            background: var(--panel);
            border: 1px solid var(--gold-faint);
            border-radius: 2px;
            padding: 12px 14px;
        }

        .effect {
            color: var(--text-bright);
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            margin: 0;
        }

        .flavor {
            color: var(--text-dim);
            font-style: italic;
            font-size: 12px;
            line-height: 1.55;
            margin: 6px 0 0;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }

        .credits {
            color: rgba(154, 154, 142, 0.55);
            font-size: 8.5px;
            font-family: 'Lora', serif;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .stats {
            display: flex;
            gap: 8px;
        }

        /* Chips de stat estilo "Deck 29" de las Zones */
        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel);
            border: 1px solid var(--gold-line);
            border-radius: 2px;
            padding: 5px 12px;
        }

        .stat .label {
            font-family: 'Lora', serif;
            color: var(--text-dim);
            font-size: 9px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .stat .value {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 16px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-overlay"></div>
        <div class="inner-border"></div>
        <div class="inner-border-2"></div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="content">
            <div class="header">
                <div class="type-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,3.25C12,3.25 6,10 6,14C6,17.32 8.69,20 12,20A6,6 0 0,0 18,14C18,10 12,3.25 12,3.25Z" />
                    </svg>
                </div>
                <div class="title-container">
                    <div class="eyebrow">Creature — Frog Druid</div>
                    <div class="title">SUNSHOWER DRUID</div>
                    <svg viewBox="0 0 200 10" width="200" height="10" style="margin-top: 3px;">
                        <line x1="10" y1="5" x2="88" y2="5" stroke="#b8a26b" stroke-width="0.8" opacity="0.6" />
                        <line x1="112" y1="5" x2="190" y2="5" stroke="#b8a26b" stroke-width="0.8" opacity="0.6" />
                        <circle cx="94" cy="5" r="1" fill="#b8a26b" />
                        <circle cx="106" cy="5" r="1" fill="#b8a26b" />
                        <rect x="97.5" y="2.5" width="5" height="5" transform="rotate(45 100 5)" fill="#b8a26b" />
                    </svg>
                </div>
                <div class="cost"><span>1</span></div>
            </div>

            <div class="spacer"></div>

            <svg class="divider" viewBox="0 0 320 12" width="320" height="12">
                <line x1="8" y1="6" x2="140" y2="6" stroke="#b8a26b" stroke-width="0.8" opacity="0.6" />
                <line x1="180" y1="6" x2="312" y2="6" stroke="#b8a26b" stroke-width="0.8" opacity="0.6" />
                <circle cx="147" cy="6" r="1" fill="#b8a26b" />
                <circle cx="173" cy="6" r="1" fill="#b8a26b" />
                <rect x="156.5" y="2.5" width="7" height="7" transform="rotate(45 160 6)" fill="none" stroke="#ead9a8"
                    stroke-width="1" />
                <rect x="158.5" y="4.5" width="3" height="3" transform="rotate(45 160 6)" fill="#b8a26b" />
            </svg>

            <div class="text-box">
                <p class="effect">When Sunshower Druid enters, put a +1/+1 counter on target creature and you gain 1
                    life.</p>
                <p class="flavor">Apprentice augurs begin their studies by predicting where the rain will fall. Even
                    those who don't succeed derive great joy from the process.</p>
            </div>

            <div class="footer">
                <div class="credits">TXW 2/50</div>
                <div class="stats">
                    <div class="stat"><span class="label">Atk</span><span class="value">0</span></div>
                    <div class="stat"><span class="label">Def</span><span class="value">2</span></div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
