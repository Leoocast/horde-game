<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hostfall · Semillas del Destino · propuesta ChatGPT</title>
<style>
@font-face {
  font-family: "Cinzel";
  src: url("../assets/fonts/cinzel-latin.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "Cinzel Decorative";
  src: url("../assets/fonts/cinzel-decorative-latin.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "Lora";
  src: url("../assets/fonts/lora-normal-latin.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "Lora";
  src: url("../assets/fonts/lora-italic-latin.woff2") format("woff2");
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: "Oswald";
  src: url("../assets/fonts/oswald-latin.woff2") format("woff2");
  font-display: swap;
}

:root {
  --void: #020607;
  --night: #071013;
  --night-2: #0b1518;
  --paper: #d9cfb2;
  --paper-bright: #f3e8c8;
  --steel: #99a7a9;
  --muted: #6e7c7f;
  --gold: #c6a052;
  --gold-bright: #ecd99e;
  --gold-line: rgb(203 175 107 / 0.34);
  --gold-faint: rgb(203 175 107 / 0.1);
  --ember: #c68155;
  --ember-line: rgb(198 129 85 / 0.45);
  --glass-line: rgb(143 157 159 / 0.14);
  --display: "Cinzel Decorative", Georgia, serif;
  --title: "Cinzel", Georgia, serif;
  --body: "Lora", Georgia, serif;
  --condensed: "Oswald", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 18% 15%, rgb(31 77 78 / 0.18), transparent 28%),
    radial-gradient(circle at 85% 80%, rgb(117 75 37 / 0.13), transparent 25%),
    #010405;
  color: var(--paper);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
}

button { border: 0; padding: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }

.game-frame {
  position: relative;
  width: min(100vw, 177.7778vh);
  aspect-ratio: 16 / 9;
  min-height: 620px;
  overflow: hidden;
  isolation: isolate;
  background:
    linear-gradient(108deg, rgb(3 8 10 / 0.9), rgb(5 12 14 / 0.72) 45%, rgb(2 6 8 / 0.94)),
    radial-gradient(ellipse at 54% 46%, #112528 0, #071013 48%, #020607 100%);
  box-shadow: 0 0 90px #000;
}

.game-frame::before,
.game-frame::after {
  position: absolute;
  z-index: -3;
  inset: 0;
  pointer-events: none;
  content: "";
}
.game-frame::before {
  opacity: 0.5;
  background-image:
    radial-gradient(circle, rgb(236 217 158 / 0.65) 0 1px, transparent 1.6px),
    radial-gradient(circle, rgb(147 190 188 / 0.55) 0 1px, transparent 1.5px),
    radial-gradient(circle, rgb(255 255 255 / 0.34) 0 0.7px, transparent 1.2px);
  background-position: 7% 18%, 32% 76%, 70% 33%;
  background-size: 190px 190px, 260px 260px, 110px 110px;
}
.game-frame::after {
  z-index: 10;
  border: 1px solid rgb(225 205 145 / 0.11);
  box-shadow: inset 0 0 90px rgb(0 0 0 / 0.62);
}

.shard {
  position: absolute;
  z-index: -2;
  width: 42%;
  height: 56%;
  border: 1px solid rgb(146 176 174 / 0.08);
  background: linear-gradient(145deg, rgb(124 166 166 / 0.035), transparent 65%);
  transform: skewX(-18deg) rotate(8deg);
  pointer-events: none;
}
.shard.one { top: -27%; left: 12%; }
.shard.two { right: -18%; bottom: -35%; transform: skewX(15deg) rotate(-10deg); }

.archive {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  padding: clamp(22px, 3vh, 40px) clamp(26px, 3.2vw, 58px) clamp(22px, 2.7vh, 34px);
}

.archive-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 30px;
  border-bottom: 1px solid var(--gold-line);
  padding-bottom: 14px;
}
.archive-kicker,
.index-label,
.page-kicker,
.duel-label,
.history-label {
  color: var(--muted);
  font: 600 10px/1 var(--condensed);
  letter-spacing: 0.31em;
  text-transform: uppercase;
}
.archive-title {
  margin: 8px 0 0;
  color: var(--paper-bright);
  font: 400 clamp(28px, 3vw, 48px)/0.96 var(--display);
  letter-spacing: -0.025em;
  text-shadow: 0 5px 24px #000;
}
.archive-intro {
  max-width: 58ch;
  margin: 10px 0 0;
  color: var(--steel);
  font-size: clamp(11px, 0.9vw, 14px);
  font-style: italic;
  line-height: 1.55;
}

.filters {
  display: flex;
  align-items: end;
  gap: 4px;
}
.filter {
  position: relative;
  min-width: 104px;
  border-bottom: 1px solid var(--glass-line);
  padding: 9px 14px 10px;
  color: var(--muted);
  font: 600 10px/1 var(--condensed);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  transition: color 160ms ease, background 160ms ease;
}
.filter:hover { color: var(--paper); }
.filter[aria-pressed="true"] {
  background: linear-gradient(180deg, transparent, var(--gold-faint));
  color: var(--gold-bright);
}
.filter[aria-pressed="true"]::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 2px;
  background: var(--gold);
  box-shadow: 0 0 10px rgb(198 160 82 / 0.42);
  content: "";
}

.archive-book {
  display: grid;
  min-height: 0;
  grid-template-columns: minmax(270px, 28%) minmax(0, 1fr);
  gap: clamp(20px, 2.7vw, 46px);
  padding-top: 14px;
}

.archive-index {
  position: relative;
  min-height: 0;
  overflow-y: auto;
  padding: 7px clamp(15px, 1.7vw, 28px) 0 1px;
  scrollbar-width: thin;
  scrollbar-color: rgb(198 160 82 / 0.28) transparent;
}
.archive-index::after {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 1px;
  background: linear-gradient(transparent, var(--gold-line) 18%, var(--gold-line) 80%, transparent);
  content: "";
  pointer-events: none;
}
.index-list { display: grid; margin: 9px 0 0; padding: 0; list-style: none; }
.index-entry {
  position: relative;
  display: grid;
  width: 100%;
  grid-template-columns: 12px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid var(--glass-line);
  padding: 13px 8px 13px 4px;
  text-align: left;
  transition: padding 160ms ease, background 160ms ease;
}
.index-entry:hover,
.index-entry[aria-current="true"] {
  padding-left: 10px;
  background: linear-gradient(90deg, var(--gold-faint), transparent 88%);
}
.state-mark {
  width: 8px;
  height: 8px;
  border: 1px solid currentColor;
  color: var(--gold);
  transform: rotate(45deg);
}
.state-mark::after {
  display: block;
  width: 2px;
  height: 2px;
  margin: 2px;
  background: currentColor;
  content: "";
}
.is-lost .state-mark { color: var(--ember); }
.entry-copy { display: grid; gap: 4px; min-width: 0; }
.entry-code {
  color: var(--paper);
  font: 600 14px/1 var(--title);
  letter-spacing: 0.12em;
}
.index-entry[aria-current="true"] .entry-code { color: var(--gold-bright); }
.entry-match {
  overflow: hidden;
  color: var(--steel);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entry-state { display: grid; justify-items: end; gap: 3px; }
.entry-state strong {
  color: var(--gold);
  font: 600 9px/1 var(--condensed);
  letter-spacing: 0.17em;
  text-transform: uppercase;
}
.is-lost .entry-state strong { color: var(--ember); }
.entry-state small { color: var(--muted); font-size: 10px; font-style: italic; white-space: nowrap; }

.archive-page {
  position: relative;
  display: grid;
  min-height: 0;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
}
.page-head {
  display: grid;
  grid-template-columns: minmax(210px, 0.7fr) minmax(360px, 1.3fr);
  align-items: end;
  gap: 24px;
  border-bottom: 1px solid var(--glass-line);
  padding: 0 0 10px;
}
.page-identity { display: grid; gap: 4px; }
.page-code {
  margin: 2px 0 0;
  color: var(--gold-bright);
  font: 600 clamp(27px, 3.1vw, 45px)/1 var(--title);
  letter-spacing: 0.11em;
  text-shadow: 0 0 22px rgb(198 160 82 / 0.26);
}
.page-verdict {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--gold);
  font: 600 10px/1 var(--condensed);
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.page-verdict::before {
  width: 15px;
  height: 1px;
  background: currentColor;
  content: "";
}
.page-verdict.lost { color: var(--ember); }
.page-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 7px 13px;
  color: var(--steel);
  font: 600 9.5px/1.4 var(--condensed);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.page-meta .dot { color: var(--gold); }
.seed-copy {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-bottom: 1px solid rgb(203 175 107 / 0.35);
  padding-bottom: 2px;
  color: var(--gold-bright);
  font-family: var(--condensed);
  letter-spacing: 0.1em;
  text-transform: none;
}

.page-body {
  display: grid;
  min-height: 0;
  grid-template-columns: minmax(340px, 0.95fr) minmax(330px, 1.05fr);
  gap: clamp(22px, 2.4vw, 38px);
  padding: 13px 0 10px;
}

.duel {
  position: relative;
  display: grid;
  min-height: 0;
  place-items: center;
  align-content: center;
  border-right: 1px solid var(--glass-line);
  padding: 0 clamp(14px, 1.5vw, 24px) 0 0;
}
.duel::before {
  position: absolute;
  inset: 9% 8% 5% 2%;
  z-index: -1;
  border: 1px solid rgb(203 175 107 / 0.09);
  background:
    radial-gradient(circle at 50% 48%, rgb(203 175 107 / 0.09), transparent 30%),
    linear-gradient(135deg, rgb(143 190 185 / 0.045), transparent 55%);
  clip-path: polygon(8% 0, 92% 0, 100% 11%, 100% 88%, 89% 100%, 10% 100%, 0 88%, 0 10%);
  content: "";
}
.duel-label { justify-self: start; align-self: start; margin: 1px 0 5px 6px; }
.cards-versus {
  position: relative;
  display: grid;
  width: min(100%, 500px);
  grid-template-columns: minmax(105px, 1fr) 42px minmax(105px, 1fr);
  align-items: center;
  justify-content: center;
}
.combatant {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 7px;
  min-width: 0;
}
.card-shell {
  position: relative;
  width: clamp(112px, 10vw, 168px);
  filter: drop-shadow(0 16px 17px rgb(0 0 0 / 0.75));
  transition: transform 180ms ease, filter 180ms ease;
}
.combatant:first-child .card-shell { transform: perspective(900px) rotateY(5deg) rotate(-2.5deg); }
.combatant:last-child .card-shell { transform: perspective(900px) rotateY(-5deg) rotate(2.5deg); }
.combatant:hover .card-shell { transform: translateY(-5px) scale(1.025); filter: drop-shadow(0 20px 22px rgb(0 0 0 / 0.82)); }
.card-shell::after {
  position: absolute;
  inset: 2.2%;
  border: 1px solid rgb(240 220 158 / 0.2);
  border-radius: 4.5% / 3.2%;
  box-shadow: inset 0 0 15px rgb(255 255 255 / 0.05);
  content: "";
  pointer-events: none;
}
.card-shell img { display: block; width: 100%; height: auto; border-radius: 4.5% / 3.2%; }
.combatant-role {
  color: var(--muted);
  font: 600 8.5px/1 var(--condensed);
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
.combatant-name {
  max-width: 190px;
  overflow: hidden;
  color: var(--paper);
  font: 600 10.5px/1.25 var(--title);
  letter-spacing: 0.03em;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.versus {
  position: relative;
  z-index: 2;
  display: grid;
  width: 38px;
  height: 38px;
  place-items: center;
  border: 1px solid var(--gold-line);
  background: #071013;
  color: var(--gold-bright);
  font: 600 13px/1 var(--title);
  box-shadow: 0 0 24px rgb(198 160 82 / 0.16);
  transform: rotate(45deg);
}
.versus span { transform: rotate(-45deg); }
.deck-match {
  margin: 8px 0 0;
  color: var(--steel);
  font-size: 11px;
  font-style: italic;
  text-align: center;
}
.deck-match b { color: var(--paper); font-weight: 400; }

.history {
  min-height: 0;
  overflow-y: auto;
  padding-right: 8px;
  scrollbar-width: thin;
  scrollbar-color: rgb(198 160 82 / 0.25) transparent;
}
.history-list {
  position: relative;
  display: grid;
  margin: 10px 0 0;
  padding: 0 0 0 18px;
  list-style: none;
}
.history-list::before {
  position: absolute;
  top: 8px;
  bottom: 9px;
  left: 4px;
  width: 1px;
  background: linear-gradient(var(--gold-line), rgb(203 175 107 / 0.08));
  content: "";
}
.attempt-button {
  position: relative;
  display: grid;
  width: 100%;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  border-bottom: 1px solid var(--glass-line);
  padding: 8px 5px 8px 2px;
  text-align: left;
}
.attempt-button::before {
  position: absolute;
  top: 13px;
  left: -17px;
  width: 7px;
  height: 7px;
  border: 1px solid var(--ember);
  background: var(--night);
  content: "";
  transform: rotate(45deg);
}
.attempt-button.victory::before,
.attempt-button[aria-current="true"]::before { background: var(--gold); border-color: var(--gold-bright); }
.attempt-main {
  color: var(--paper);
  font-size: 12px;
  line-height: 1.35;
}
.attempt-main b { color: var(--gold-bright); font-weight: 400; }
.attempt-main .defeat { color: var(--ember); }
.attempt-main .victory { color: var(--gold); }
.attempt-when {
  color: var(--muted);
  font: 600 8.5px/1.5 var(--condensed);
  letter-spacing: 0.13em;
  text-transform: uppercase;
  white-space: nowrap;
}
.attempt-note {
  position: relative;
  margin-top: 12px;
  border: 1px solid rgb(203 175 107 / 0.2);
  border-left: 2px solid var(--gold);
  padding: 12px 14px 11px;
  background: linear-gradient(110deg, rgb(198 160 82 / 0.075), rgb(7 16 19 / 0.42));
}
.attempt-note::before {
  position: absolute;
  top: -6px;
  left: 19px;
  width: 10px;
  height: 10px;
  border-top: 1px solid rgb(203 175 107 / 0.2);
  border-left: 1px solid rgb(203 175 107 / 0.2);
  background: #0a1416;
  content: "";
  transform: rotate(45deg);
}
.attempt-note p { margin: 0; color: var(--steel); font-size: 11.5px; line-height: 1.55; }
.attempt-note .fact {
  margin-top: 8px;
  color: var(--paper);
  font-style: italic;
}
.attempt-note .fact::before { color: var(--gold); content: "◆ "; font-style: normal; }
.history-close {
  margin: 11px 0 0 18px;
  color: var(--gold);
  font: 600 10px/1.35 var(--title);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.history-close.lost { color: var(--ember); }
.history-close small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font: italic 10.5px/1.35 var(--body);
  letter-spacing: 0;
  text-transform: none;
}

.page-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  border-top: 1px solid var(--gold-line);
  padding-top: 11px;
}
.action-quiet,
.action-primary {
  min-width: 210px;
  height: 42px;
  padding: 0 21px;
  font: 600 10px/1 var(--title);
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
.action-quiet {
  border: 1px solid var(--glass-line);
  color: var(--steel);
}
.action-quiet:hover { border-color: var(--gold-line); color: var(--paper-bright); }
.action-primary {
  position: relative;
  border: 1px solid rgb(225 197 123 / 0.66);
  background: linear-gradient(180deg, #604c25, #2c2516);
  color: #fff0c2;
  text-shadow: 0 1px #000;
  box-shadow: inset 0 1px rgb(255 244 205 / 0.12), 0 8px 20px rgb(0 0 0 / 0.28);
}
.action-primary::before {
  position: absolute;
  inset: 3px;
  border: 1px solid rgb(255 236 174 / 0.14);
  content: "";
  pointer-events: none;
}
.action-primary:hover { filter: brightness(1.13); }

.toast {
  position: absolute;
  z-index: 20;
  right: 28px;
  bottom: 26px;
  min-width: 250px;
  border: 1px solid var(--gold-line);
  border-left: 2px solid var(--gold);
  padding: 10px 14px;
  background: rgb(5 12 14 / 0.96);
  color: var(--paper);
  font: 600 10px/1.4 var(--condensed);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 180ms ease, transform 180ms ease;
}
.toast.show { opacity: 1; transform: none; }

@media (max-width: 1100px) {
  .game-frame { width: 100vw; min-height: 760px; aspect-ratio: auto; }
  .archive { position: relative; min-height: 760px; }
  .archive-book { grid-template-columns: 260px minmax(0, 1fr); }
  .page-body { grid-template-columns: minmax(300px, 0.95fr) minmax(285px, 1.05fr); }
  .archive-index::after { display: none; }
  .card-shell { width: clamp(105px, 12vw, 145px); }
}

@media (max-width: 780px) {
  body { display: block; }
  .game-frame { min-height: 1180px; }
  .archive { min-height: 1180px; padding: 24px 20px; }
  .archive-head { grid-template-columns: 1fr; align-items: start; }
  .filters { justify-content: flex-start; }
  .filter { min-width: 0; }
  .archive-book { grid-template-columns: 1fr; }
  .archive-index { max-height: 250px; padding-right: 0; }
  .archive-page { overflow: visible; }
  .page-head { grid-template-columns: 1fr; }
  .page-meta { justify-content: flex-start; }
  .page-body { grid-template-columns: 1fr; }
  .duel { min-height: 430px; border-right: 0; border-bottom: 1px solid var(--glass-line); padding: 0 0 18px; }
  .page-actions { flex-wrap: wrap; }
  .action-quiet, .action-primary { flex: 1 1 240px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<main class="game-frame" aria-label="Maqueta del Archivo de Semillas del Destino">
  <span class="shard one" aria-hidden="true"></span>
  <span class="shard two" aria-hidden="true"></span>
  <section class="archive">
    <header class="archive-head">
      <div>
        <span class="archive-kicker">Archivo del Cronista</span>
        <h1 class="archive-title">Semillas del Destino</h1>
        <p class="archive-intro">Aquí reposan los futuros que contemplaste: aquellos que lograste preservar y aquellos que la Hueste reclamó.</p>
      </div>
      <nav class="filters" aria-label="Filtrar futuros por desenlace" id="filters"></nav>
    </header>

    <div class="archive-book">
      <aside class="archive-index" aria-labelledby="index-label">
        <p class="index-label" id="index-label">Futuros contemplados</p>
        <ol class="index-list" id="future-list"></ol>
      </aside>
      <article class="archive-page" id="future-page" aria-live="polite"></article>
    </div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script>

const CARD_ROOT = "../../../public/cards/";

const FUTURES = [

const state = { filter: "all", code: FUTURES[0].code, attempt: FUTURES[0].attempts.length - 1 };
const filters = document.getElementById("filters");
const list = document.getElementById("future-list");
const page = document.getElementById("future-page");
const toast = document.getElementById("toast");
let toastTimer = 0;

function futureByCode(code) {
  return FUTURES.find((future) => future.code === code) || FUTURES[0];
}

function visibleFutures() {
  return state.filter === "all" ? FUTURES : FUTURES.filter((future) => future.state === state.filter);
}

function stateWord(future) {
  return future.state === "preserved" ? "Preservado" : "Perdido";
}

function resultWord(attempt) {
  return attempt.result === "victory" ? "victoria" : "derrota";
}

function attemptCount(future) {
  return future.attempts.length === 1 ? "1 intento" : future.attempts.length + " intentos";
}

function renderFilters() {
  const options = [
    ["all", "Todos"],
    ["preserved", "Preservados"],
    ["lost", "Perdidos"]
  ];
  filters.innerHTML = options.map(([id, label]) =>
    `<button class="filter" type="button" data-filter="${id}" aria-pressed="${state.filter === id}">${label}</button>`
  ).join("");

  filters.querySelectorAll("[data-filter]").forEach((button) => {
    button.addEventListener("click", () => {
      state.filter = button.dataset.filter;
      const visible = visibleFutures();
      if (!visible.some((future) => future.code === state.code)) {
        state.code = visible[0].code;
        state.attempt = visible[0].attempts.length - 1;
      }
      render();
      filters.querySelector(`[data-filter="${state.filter}"]`).focus();
    });
  });
}

function renderList() {
  list.innerHTML = visibleFutures().map((future) => {
    const selected = future.code === state.code;
    const lost = future.state === "lost" ? " is-lost" : "";
    return `<li>
      <button class="index-entry${lost}" type="button" data-code="${future.code}" aria-current="${selected}">
        <span class="state-mark" aria-hidden="true"></span>
        <span class="entry-copy">
          <span class="entry-code">${future.code}</span>
          <span class="entry-match">${future.chronicle.short} contra ${future.host.short}</span>
        </span>
        <span class="entry-state"><strong>${stateWord(future)}</strong><small>${attemptCount(future)}</small></span>
      </button>
    </li>`;
  }).join("");

  const entries = Array.from(list.querySelectorAll(".index-entry"));
  entries.forEach((entry, index) => {
    entry.addEventListener("click", () => selectFuture(entry.dataset.code));
    entry.addEventListener("keydown", (event) => {
      let next = -1;
      if (event.key === "ArrowDown") next = Math.min(index + 1, entries.length - 1);
      if (event.key === "ArrowUp") next = Math.max(index - 1, 0);
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = entries.length - 1;
      if (next < 0) return;
      event.preventDefault();
      selectFuture(entries[next].dataset.code, true);
    });
  });
}

function renderPage() {
  const future = futureByCode(state.code);
  const currentAttempt = future.attempts[state.attempt] || future.attempts[future.attempts.length - 1];
  const lost = future.state === "lost";
  const closeText = lost
    ? `Contemplado ${attemptCount(future)}; ninguna reescritura logró preservarlo.`
    : future.attempts.length === 1
      ? "Preservado desde el primer presagio."
      : `Preservado en la ${future.attempts[future.attempts.length - 1].title.toLowerCase()}.`;

  page.innerHTML = `
    <header class="page-head">
      <div class="page-identity">
        <span class="page-kicker">Futuro</span>
        <h2 class="page-code">${future.code}</h2>
        <span class="page-verdict${lost ? " lost" : ""}">${lost ? "Futuro perdido" : "Destino preservado"}</span>
      </div>
      <div class="page-meta">
        <span>${future.difficulty}</span><span class="dot">◆</span>
        <span>Preparación ${future.preparation}</span><span class="dot">◆</span>
        <span>${future.lastSeen}</span><span class="dot">◆</span>
        <button type="button" class="seed-copy" data-copy="${future.seed}" title="Copiar semilla">${future.seed} ⧉</button>
      </div>
    </header>

    <div class="page-body">
      <section class="duel" aria-label="Enfrentamiento de este futuro">
        <p class="duel-label">El enfrentamiento</p>
        <div class="cards-versus">
          <div class="combatant">
            <div class="card-shell"><img src="${future.chronicle.image}" alt="Carta ${future.chronicle.card}" /></div>
            <span class="combatant-role">Tu Crónica</span>
            <span class="combatant-name" title="${future.chronicle.card}">${future.chronicle.card}</span>
          </div>
          <div class="versus" aria-hidden="true"><span>VS</span></div>
          <div class="combatant">
            <div class="card-shell"><img src="${future.host.image}" alt="Carta ${future.host.card}" /></div>
            <span class="combatant-role">La Hueste</span>
            <span class="combatant-name" title="${future.host.card}">${future.host.card}</span>
          </div>
        </div>
        <p class="deck-match"><b>${future.chronicle.deck}</b> contra <b>${future.host.deck}</b></p>
      </section>

      <section class="history" aria-labelledby="history-label">
        <p class="history-label" id="history-label">Hilo de reescrituras</p>
        <ol class="history-list">
          ${future.attempts.map((attempt, index) => `
            <li>
              <button class="attempt-button ${attempt.result}" type="button" data-attempt="${index}" aria-current="${index === state.attempt}">
                <span class="attempt-main"><b>${attempt.title}</b> · <span class="${attempt.result}">${resultWord(attempt)}</span> en el turno ${attempt.turn} · Vida ${attempt.life}</span>
                <span class="attempt-when">${attempt.when}</span>
              </button>
            </li>`).join("")}
        </ol>
        <div class="attempt-note">
          <p>${currentAttempt.text}</p>
          <p class="fact">${currentAttempt.fact}</p>
        </div>
        <p class="history-close${lost ? " lost" : ""}">${lost ? "La Hueste reclamó este futuro" : "Este destino quedó preservado"}<small>${closeText}</small></p>
      </section>
    </div>

    <footer class="page-actions">
      <button type="button" class="action-quiet" data-action="${lost ? "Contemplar otro futuro" : "Reescribir este futuro"}">${lost ? "Contemplar otro futuro" : "Reescribir este futuro"}</button>
      <button type="button" class="action-primary" data-action="${lost ? "Reescribir este futuro" : "Contemplar otro futuro"}">${lost ? "Reescribir este futuro" : "Contemplar otro futuro"}</button>
    </footer>`;

  page.querySelectorAll("[data-attempt]").forEach((button) => {
    button.addEventListener("click", () => {
      state.attempt = Number(button.dataset.attempt);
      renderPage();
      page.querySelector(`[data-attempt="${state.attempt}"]`).focus();
    });
  });

  page.querySelector("[data-copy]").addEventListener("click", async (event) => {
    const value = event.currentTarget.dataset.copy;
    try { await navigator.clipboard.writeText(value); } catch (_) { /* La maqueta puede abrirse como file://. */ }
    announce("Semilla copiada · " + value);
  });

  page.querySelectorAll("[data-action]").forEach((button) => {
    button.addEventListener("click", () => announce(button.dataset.action + " · acción de maqueta"));
  });
}

function selectFuture(code, focusEntry = false) {
  state.code = code;
  const future = futureByCode(code);
  state.attempt = future.attempts.length - 1;
  renderList();
  renderPage();
  if (focusEntry) list.querySelector(`[data-code="${code}"]`).focus();
}

function announce(message) {
  window.clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add("show");
  toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
}

function render() {
  renderFilters();
  renderList();
  renderPage();
}

render();
</script>
